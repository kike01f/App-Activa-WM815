  <style>

    html {

    .maq::before { content: ''; position: absolute; left: 0.45rem; top: 0.42rem; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
    .maq::after { content: ''; position: absolute; right: 0.45rem; top: 0.45rem; width: 1.3rem; height: 0.3rem; border-radius: 99px; background: #94a3b8; }
    .puerta { position: absolute; left: 50%; top: 1.35rem; width: 3.3rem; height: 3.3rem; margin-left: -1.65rem; border-radius: 50%; background: #475569; border: 0.28rem solid #94a3b8; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.85); font-size: 1rem; overflow: hidden; }
    .eq.en_uso .puerta { background: radial-gradient(circle at 35% 35%, #93c5fd, #1d4ed8); }
    .eq.en_uso .puerta i { animation: giro 1.6s linear infinite; }
    .eq.fuera_servicio .puerta { background: #3f1d1d; color: #fca5a5; }
    @keyframes giro { to { transform: rotate(360deg); } }
    .eq .det {

      font-size: 0.8rem; color: var(--text-secondary); line-height: 1.35;
    }
    .eq .det b { color: var(--text-main); font-size: 1.05rem; }
    .eq .cta { margin-top: auto; font-size: 0.8rem; font-weight: 700; color: var(--c); min-height: 1.2em; }
    .eq.en_uso .cta { color: #93c5fd; }

    .nota { text-align: center; color: var(--text-secondary); font-size: 0.76rem; margin: 0.65rem 0 0; }
    .estado-pantalla { text-align: center; padding: 3.5rem 1rem; color: var(--text-secondary); }

    .velo { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: none; align-items: flex-end; justify-content: center; z-index: 10050; padding: 1rem; }
    .velo.open { display: flex; }
    .hoja {
      width: 100%; max-width: 480px; background: var(--card-color); border: 1px solid var(--gray-300);
      border-radius: var(--radius); padding: 1rem 1.1rem calc(1rem + env(safe-area-inset-bottom));

    .hoja h2 { margin: 0 0 0.35rem; font-size: 1.15rem; color: var(--text-main); }
    .hoja p { margin: 0 0 0.75rem; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.45; }
    .hoja label { display: block; font-weight: 600; font-size: 0.85rem; margin: 0.65rem 0 0.35rem; color: var(--text-secondary); }
    .hoja input {
      width: 100%; padding: 0.85rem; font-size: 1.25rem; font-weight: 700; letter-spacing: .06em; text-align: center;
      border-radius: 8px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); font-family: inherit;
    }
    .hoja input:focus { outline: 2px solid var(--blue-500); border-color: transparent; }
    .err { color: #fca5a5; font-size: 0.86rem; min-height: 1.2em; margin: 0.5rem 0 0; }

      padding: 0.65rem 0.8rem; margin-bottom: 0.75rem; font-size: 0.92rem; line-height: 1.55;
    }
    .botones { display: flex; gap: 8px; margin-top: 0.85rem; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 0.7rem 1rem; border-radius: 8px; border: none; font: inherit; font-weight: 600;
      font-size: 0.95rem; cursor: pointer; min-width: 7rem;
    }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn-p { background: var(--blue-500); color: var(--on-accent); }
    .btn-p:hover { background: var(--blue-400); }
    .btn-p.azul { background: var(--lav-uso); color: #fff; }
    .btn-s { background: var(--gray-200); color: var(--gray-800); border: 1px solid var(--gray-300); }
    .btn-s:hover { background: var(--gray-300); color: #f8fafc; }
    .btn-mini { flex: 0 0 auto; padding: 0.45rem 0.75rem; font-size: 0.82rem; min-width: 0; }
    .codigo { font-size: 2.35rem; font-weight: 800; letter-spacing: .28em; text-align: center; color: var(--blue-400); margin: 0.35rem 0 0.65rem; }
    .ok-ic { font-size: 2.4rem; color: var(--success); text-align: center; margin-bottom: 0.35rem; }
    .toast {
      position: fixed; left: 50%; bottom: calc(1rem + env(safe-area-inset-bottom)); transform: translateX(-50%);
      background: var(--card-color); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.9rem; z-index: 10060; display: none;
      max-width: 92vw; text-align: center; box-shadow: var(--shadow);
    }
    .foot {
      margin-top: 0.85rem; text-align: center; color: var(--text-secondary); font-size: 0.74rem;
    }
    .foot strong { color: color-mix(in srgb, var(--blue-400) 70%, #e2e8f0); font-weight: 600; }
    /* Arturito — aviso de límite (misma animación de carga de conserjería) */
    .modulo-carga {
      position: fixed; inset: 0; z-index: 12000; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; background: color-mix(in srgb, #0f172a 78%, transparent);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      animation: miniOverlayIn 0.28s ease both;
    }
    .modulo-carga.is-out { animation: miniOverlayOut 0.28s ease forwards; }
    @keyframes miniOverlayIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes miniOverlayOut { to { opacity: 0; } }
    .modulo-carga-card { width: min(17.5rem, 90vw); text-align: center; }
    .mini-carga { position: relative; width: 9.6rem; height: 9.6rem; margin: 0 auto 0.85rem; }
    .mini-carga::before {
      content: ''; position: absolute; inset: 0.2rem; border-radius: 50%;
      border: 1.5px dashed color-mix(in srgb, #74bd20 65%, transparent);
      animation: miniAnillo 9s linear infinite;
    }
    @keyframes miniAnillo { to { transform: rotate(-360deg); } }
    .mini-arturito {
      position: absolute; left: 50%; top: 50%; z-index: 2; width: 3.4rem; height: 3.4rem;
      margin: -1.7rem 0 0 -1.7rem; display: grid; place-items: center; border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, rgba(143, 203, 26, 0.35), transparent 70%);
      animation: miniFlota 1.6s ease-in-out infinite;
    }
    .mini-arturito svg { width: 3rem; height: 3rem; overflow: visible; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.35)); }
    @keyframes miniFlota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .mini-ojo { transform-box: fill-box; transform-origin: center; animation: miniParpadeo 3.4s ease-in-out infinite; }
    @keyframes miniParpadeo { 0%, 84%, 100% { transform: scaleY(1); } 90% { transform: scaleY(0.12); } }
    .mini-antena { animation: miniAntena 0.9s ease-in-out infinite alternate; }
    @keyframes miniAntena { from { opacity: 0.35; } to { opacity: 1; } }
    .mini-ficha {
      --tono: #7FBA02; position: absolute; left: 50%; top: 50%; width: 2rem; height: 2.45rem;
      margin: -1.22rem 0 0 -1rem; border-radius: 6px; background: linear-gradient(180deg, #ffffff, #e8eef5);
      box-shadow: 0 8px 14px -6px rgba(0,0,0,0.45); animation: miniGira 2.8s linear infinite;
    }
    .mini-ficha::before { content: ''; display: block; height: 4px; margin: 0.38rem 0.35rem 0; border-radius: 99px; background: var(--tono); }
    .mini-ficha::after {
      content: ''; display: block; width: 62%; height: 3px; margin: 0.32rem 0.35rem 0; border-radius: 99px;
      background: #cbd5e1; box-shadow: 0 0.38rem 0 #cbd5e1, 0 0.76rem 0 #e2e8f0;
    }
    .mini-ficha--2 { --tono: #22d3ee; animation-delay: -0.93s; }
    .mini-ficha--3 { --tono: #f59e0b; animation-delay: -1.86s; }
    @keyframes miniGira {
      0% { transform: rotate(0deg) translateX(3.35rem) rotate(0deg) scale(1); z-index: 2; }
      25% { transform: rotate(90deg) translateX(3.35rem) rotate(-90deg) scale(0.72); z-index: 1; }
      50% { transform: rotate(180deg) translateX(3.35rem) rotate(-180deg) scale(1); z-index: 2; }
      75% { transform: rotate(270deg) translateX(3.35rem) rotate(-270deg) scale(1.08); z-index: 3; }
      100% { transform: rotate(360deg) translateX(3.35rem) rotate(-360deg) scale(1); z-index: 2; }
    }
    .modulo-carga .carga-titulo { margin: 0; font-size: 1.05rem; font-weight: 700; color: #f8fafc; }
    .modulo-carga .carga-sub { margin: 0.35rem 0 0; font-size: 0.88rem; font-weight: 600; color: #9fe04a; line-height: 1.4; }
    .modulo-carga .carga-detalle { margin: 0.55rem 0 0; font-size: 0.82rem; color: #c5d0e0; line-height: 1.4; }
    .carga-puntos i { font-style: normal; display: inline-block; animation: cargaPunto 1.2s ease-in-out infinite; }
    .carga-puntos i:nth-child(2) { animation-delay: 0.15s; }

    @keyframes cargaPunto { 0%, 70%, 100% { transform: translateY(0); opacity: 0.4; } 35% { transform: translateY(-5px); opacity: 1; } }
    .modulo-carga .carga-barra {

    }
    @keyframes cargaBarra { from { left: -40%; } to { left: 100%; } }
    .modulo-carga .carga-accion { margin-top: 1rem; }

      .brand img { width: 52px; height: 52px; }

      .legend { gap: 0.55rem; font-size: 0.74rem; }

    @media (prefers-reduced-motion: reduce) {
      .eq.en_uso .puerta i, .hoja, .modulo-carga, .modulo-carga.is-out,
      .mini-carga::before, .mini-arturito, .mini-ojo, .mini-antena, .mini-ficha,
      .carga-puntos i, .modulo-carga .carga-barra span { animation: none !important; }
    }
  </style>

<div class="velo" id="velo" role="dialog" aria-modal="true" aria-labelledby="hojaTitulo">
  <div class="hoja" id="hoja"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script>
(function () {
  /* Mismo proyecto Firestore que conserjeria wm.html (window.__PCSH_FIREBASE_CONFIG__). */
  var FIREBASE = {
    apiKey: 'AIzaSyBUhQQcloZtxcz6jnFXt3MflAkYZMlka6g',
    authDomain: 'conserjeria2-1.firebaseapp.com',
    projectId: 'conserjeria2-1',
    storageBucket: 'conserjeria2-1.firebasestorage.app',
    messagingSenderId: '832568527054',
    appId: '1:832568527054:web:b463e8b875ba9a3519289f'
  };
  var COL_CFG = 'pcsh_lavanderia';
  var COL_EQ = 'pcsh_lavanderia_equipos';
  var COL_USOS = 'pcsh_lavanderia_usos';
  var LS_MIOS = 'pcsh_lav_mis_usos_v1';
  var LS_INTENTOS = 'pcsh_lav_intentos_v1';
  var TZ = 'America/Santiago';
  var IDS = ['lavadora-1', 'lavadora-2', 'lavadora-3', 'lavadora-4', 'lavadora-5', 'secadora-1', 'secadora-2', 'secadora-3', 'secadora-4', 'secadora-5'];
  var TIPOS = { lavadora: { label: 'Lavadora', plural: 'Lavadoras', icon: 'fa-water' }, secadora: { label: 'Secadora', plural: 'Secadoras', icon: 'fa-wind' } };
  var ESTADO_TXT = { disponible: 'Disponible', en_uso: 'En uso', fuera_servicio: 'Fuera de servicio' };

  var token = new URLSearchParams(location.search).get('k') || '';
  var st = { cfg: null, equipos: {}, cargado: { cfg: false, eq: false } };

  var app = firebase.initializeApp(FIREBASE);
  var db = firebase.firestore(app);

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(v) { return String(v == null ? '' : v).trim().toLowerCase().replace(/\s/g, ''); }
  function nowIso() { return new Date().toISOString(); }
  function hora(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
  }
  function fechaHora(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleString('es-CL', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: TZ });
  }
  function minutos(ms) {
    var m = Math.max(0, Math.round(ms / 60000));
    return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }
  function label(eq) { return TIPOS[eq.tipo].label + ' ' + eq.numero; }
  function aleatorio(n, alfabeto) {
    var a = new Uint8Array(n);
    crypto.getRandomValues(a);
    var out = '';
    for (var i = 0; i < n; i++) out += alfabeto[a[i] % alfabeto.length];
    return out;
  }
  /** Mismo algoritmo que el panel de conserjería. */
  function hashCodigo(usoId, codigo) {
    var str = 'lav|' + usoId + '|' + codigo;
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < str.length; i++) {
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
  }
  function errUsuario(msg, extra) {
    var e = new Error(msg);
    e.lavUsuario = true;
    if (extra && typeof extra === 'object') Object.keys(extra).forEach(function (k) { e[k] = extra[k]; });
    return e;
  }
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.style.display = 'none'; }, 3800);
  }
  function equiposEnUsoUnidad(unidad) {
    var k = norm(unidad);
    return IDS.map(function (id) { return st.equipos[id]; }).filter(function (eq) {
      return eq && eq.estado === 'en_uso' && norm(eq.unidad) === k;
    });
  }
  function limiteUnidad(unidad) {
    var max = Number(st.cfg && st.cfg.maxPorUnidad) || 0;
    var enUso = equiposEnUsoUnidad(unidad).length;
    return { max: max, enUso: enUso, superado: !!(max && enUso >= max) };
  }
  function arturitoHtml(titulo, sub, detalle) {
    return '<div class="mini-carga" aria-hidden="true">' +
      '<span class="mini-ficha"></span><span class="mini-ficha mini-ficha--2"></span><span class="mini-ficha mini-ficha--3"></span>' +
      '<div class="mini-arturito"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
      '<line x1="32" y1="12" x2="32" y2="5" stroke="#5a8501" stroke-width="2.4"/>' +
      '<circle class="mini-antena" cx="32" cy="4.5" r="3.2" fill="#FFD700"/>' +
      '<rect x="10" y="14" width="44" height="42" rx="12" fill="#7FBA02"/>' +
      '<rect x="15" y="20" width="34" height="24" rx="6" fill="#1a1a1a"/>' +
      '<ellipse class="mini-ojo" cx="26" cy="31" rx="3.1" ry="3.1" fill="#7FBA02"/>' +
      '<ellipse class="mini-ojo" cx="38" cy="31" rx="3.1" ry="3.1" fill="#7FBA02"/>' +
      '<path d="M26 39 Q32 44 38 39" stroke="#7FBA02" stroke-width="2.2" fill="none" stroke-linecap="round"/>' +
      '</svg></div></div>' +
      '<p class="carga-titulo">' + esc(titulo) + '<span class="carga-puntos" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>' +
      '<p class="carga-sub">' + esc(sub) + '</p>' +
      (detalle ? '<p class="carga-detalle">' + esc(detalle) + '</p>' : '') +
      '<div class="carga-barra" aria-hidden="true"><span></span></div>' +
      '<div class="carga-accion"><button type="button" class="btn btn-p" data-cerrar-limite>Entendido</button></div>';
  }
  function cerrarAvisoLimite() {
    var velo = document.querySelector('.modulo-carga');
    if (!velo) return;
    velo.classList.add('is-out');
    setTimeout(function () { if (velo.parentNode) velo.remove(); }, 280);
  }
  function mostrarAvisoLimite(unidad, enUso, max) {
    cerrarHoja();
    document.querySelectorAll('.modulo-carga').forEach(function (n) { n.remove(); });
    var velo = document.createElement('div');
    velo.className = 'modulo-carga';
    velo.setAttribute('role', 'alertdialog');
    velo.setAttribute('aria-modal', 'true');
    velo.setAttribute('aria-live', 'assertive');
    velo.innerHTML = '<div class="modulo-carga-card">' + arturitoHtml(
      'Límite alcanzado',
      'Arturito revisa sus equipos…',
      'El depto ' + unidad + ' ya tiene ' + enUso + ' equipo(s) en uso. El máximo permitido es ' + max + '. Libere uno antes de registrar otro.'
    ) + '</div>';
    document.body.appendChild(velo);
    var btn = velo.querySelector('[data-cerrar-limite]');
    if (btn) setTimeout(function () { btn.focus(); }, 80);
  }
  function esErrorLimite(e) {
    if (!e) return false;
    if (e.lavLimite) return true;
    return /máximo|maximo|ya tiene .* en uso/i.test(String(e.message || ''));
  }

  /* ---------- Registros propios de este dispositivo ---------- */
  function misUsos() {
    try { var v = JSON.parse(localStorage.getItem(LS_MIOS) || '{}'); return v && typeof v === 'object' ? v : {}; } catch (e) { return {}; }
  }
  function guardarMio(eqId, dato) {
    var m = misUsos();
    if (dato) m[eqId] = dato; else delete m[eqId];
    try { localStorage.setItem(LS_MIOS, JSON.stringify(m)); } catch (e) {}
  }
  function mioVigente(eq) {
    var m = misUsos()[eq.id];
    return m && eq.estado === 'en_uso' && m.usoId === eq.usoId ? m : null;
  }
  function bloqueoIntentos() {
    try {
      var v = JSON.parse(localStorage.getItem(LS_INTENTOS) || '{}');
      if (v.hasta && Date.now() < v.hasta) return Math.ceil((v.hasta - Date.now()) / 1000);
    } catch (e) {}
    return 0;
  }
  function sumarIntentoFallido() {
    var v = {};
    try { v = JSON.parse(localStorage.getItem(LS_INTENTOS) || '{}'); } catch (e) {}
    v.n = (v.n || 0) + 1;
    if (v.n >= 5) { v.hasta = Date.now() + 60000; v.n = 0; }
    try { localStorage.setItem(LS_INTENTOS, JSON.stringify(v)); } catch (e) {}
  }

  /* ---------- Validaciones ---------- */
  function accesoValido() { return !!(st.cfg && token && st.cfg.tokenPublico && token === st.cfg.tokenPublico); }
  function buscarUnidad(raw) {
    var k = norm(raw);
    var lista = (st.cfg && st.cfg.unidades) || [];
    for (var i = 0; i < lista.length; i++) if (norm(lista[i]) === k) return String(lista[i]);
    return '';
  }
  function unidadBloqueada(num) {
    var k = norm(num);
    return ((st.cfg && st.cfg.bloqueadas) || []).some(function (u) { return norm(u) === k; });
  }

  /* ---------- Transacciones ---------- */
  function registrar(eqId, unidad) {
    var usoId = 'lav_' + Date.now() + '_' + aleatorio(6, 'abcdefghijkmnpqrstuvwxyz23456789');
    var codigo = aleatorio(4, '0123456789');
    var inicio = nowIso();
    var cfgRef = db.collection(COL_CFG).doc('config');
    var refs = IDS.map(function (id) { return db.collection(COL_EQ).doc(id); });
    var idx = IDS.indexOf(eqId);
    return db.runTransaction(function (tx) {
      return Promise.all([tx.get(cfgRef)].concat(refs.map(function (r) { return tx.get(r); }))).then(function (snaps) {
        var cfg = snaps[0].exists ? snaps[0].data() || {} : {};
        if (!cfg.tokenPublico || cfg.tokenPublico !== token) throw errUsuario('El enlace ya no es válido. Escanee nuevamente el código QR de la lavandería.');
        var s = snaps[1 + idx];
        if (!s.exists) throw errUsuario('El equipo no existe.');
        var eq = s.data();
        if (eq.estado === 'fuera_servicio') throw errUsuario('Este equipo está fuera de servicio.');
        if (eq.estado !== 'disponible') throw errUsuario('Otra unidad acaba de registrar este equipo. Elija otro equipo disponible.');
        var k = norm(unidad);
        var enUso = snaps.slice(1).filter(function (x) { return x.exists && x.data().estado === 'en_uso' && norm(x.data().unidad) === k; }).length;
        var max = Number(cfg.maxPorUnidad) || 0;
        if (max && enUso >= max) {
          throw errUsuario('Su unidad ya tiene ' + enUso + ' equipo(s) en uso. El máximo simultáneo es ' + max + '.', {
            lavLimite: true, enUso: enUso, max: max, unidad: unidad
          });
        }
        tx.update(refs[idx], {
          estado: 'en_uso', unidad: unidad, usoId: usoId, inicio: inicio, codigoHash: hashCodigo(usoId, codigo), motivo: '',
          actualizadoAt: inicio, actualizadoPor: 'Residente ' + unidad, origen: 'qr'
        });
        tx.set(db.collection(COL_USOS).doc(usoId), {
          equipoId: eqId, tipo: eq.tipo, numero: eq.numero, unidad: unidad, inicio: inicio,
          inicioServidor: firebase.firestore.FieldValue.serverTimestamp(),
          codigo: codigo,
          fin: '', duracionMin: null, estado: 'en_uso', origen: 'qr', registradoPor: 'Residente ' + unidad,
          liberadoPor: '', liberadoPorNombre: '', correoEstado: 'pendiente', correoIntento: 0
        });
      });
    }).then(function () {
      guardarMio(eqId, { usoId: usoId, unidad: unidad, codigo: codigo, inicio: inicio });
      return { usoId: usoId, codigo: codigo };
    });
  }
  function liberar(eqId, unidad, codigo) {
    var ref = db.collection(COL_EQ).doc(eqId);
    var cfgRef = db.collection(COL_CFG).doc('config');
    var fin = nowIso();
    return db.runTransaction(function (tx) {
      return Promise.all([tx.get(cfgRef), tx.get(ref)]).then(function (snaps) {
        var cfg = snaps[0].exists ? snaps[0].data() || {} : {};
        if (!cfg.tokenPublico || cfg.tokenPublico !== token) throw errUsuario('El enlace ya no es válido. Escanee nuevamente el código QR de la lavandería.');
        var eq = snaps[1].exists ? snaps[1].data() : null;
        if (!eq || eq.estado !== 'en_uso') throw errUsuario('Este equipo ya fue liberado.');
        if (norm(eq.unidad) !== norm(unidad)) throw errUsuario('Este equipo está registrado a nombre de otro departamento.');
        if (eq.codigoHash !== hashCodigo(eq.usoId, codigo)) { var e = errUsuario('El código no coincide con el entregado al registrar el equipo.'); e.codigo = true; throw e; }
        var ms = Date.parse(fin) - Date.parse(eq.inicio || fin);
        tx.update(ref, {
          estado: 'disponible', unidad: '', usoId: '', inicio: '', codigoHash: '', motivo: '',
          actualizadoAt: fin, actualizadoPor: 'Residente ' + eq.unidad, origen: 'qr'
        });
        tx.set(db.collection(COL_USOS).doc(eq.usoId), {
          fin: fin, duracionMin: isFinite(ms) ? Math.max(0, Math.round(ms / 60000)) : null, estado: 'finalizado',
          liberadoPor: 'residente', liberadoPorNombre: 'Residente ' + eq.unidad
        }, { merge: true });
      });
    }).then(function () { guardarMio(eqId, null); });
  }

  /* ---------- Render ---------- */
  function pantalla(icono, titulo, texto) {
    $('app').innerHTML = '<div class="estado-pantalla"><i class="fa-solid ' + icono + '" aria-hidden="true"></i><h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p></div>';
  }
  function duracionMin(tipo) {
    var v = Number(st.cfg && (tipo === 'secadora' ? st.cfg.duracionSecadoraMin : st.cfg.duracionLavadoraMin));
    return v > 0 ? v : 45;
  }
  function tarjeta(eq) {
    var estado = ESTADO_TXT[eq.estado] ? eq.estado : 'disponible';
    var mio = mioVigente(eq);
    var det, cta;
    if (estado === 'en_uso') {
      var t0 = Date.parse(eq.inicio);
      var fin = t0 + duracionMin(eq.tipo) * 60000;
      det = 'Depto <b>' + esc(eq.unidad) + '</b><br>' + (Date.now() > fin ? 'Hace ' + minutos(Date.now() - t0) : 'Fin aprox. ' + hora(new Date(fin).toISOString()));
      cta = mio ? 'Toque para finalizar' : '¿Es suyo? Finalizar';
    } else if (estado === 'fuera_servicio') {
      det = 'No habilitado para su uso';
      cta = '&nbsp;';
    } else {
      det = 'Libre para usar';
      cta = 'Toque para registrar';
    }
    var pillTxt = estado === 'fuera_servicio' ? 'Sin servicio' : ESTADO_TXT[estado];
    return '<button type="button" class="eq ' + estado + '" data-eq="' + esc(eq.id) + '"' + (estado === 'fuera_servicio' ? ' aria-disabled="true"' : '') +
      ' aria-label="' + esc(label(eq) + ', ' + ESTADO_TXT[estado] + (estado === 'en_uso' ? ', departamento ' + eq.unidad : '')) + '">' +
      (mio ? '<span class="mio">SUYO</span>' : '') +
      '<span class="nom"><span>' + esc(label(eq)) + '</span><span class="pill">' + pillTxt + '</span></span>' +
      '<span class="maq"><span class="puerta"><i class="fa-solid ' + (estado === 'fuera_servicio' ? 'fa-triangle-exclamation' : TIPOS[eq.tipo].icon) + '" aria-hidden="true"></i></span></span>' +
      '<span class="det">' + det + '</span>' +
      '<span class="cta">' + cta + '</span>' +
      '</button>';
  }
  function render() {
    if (!st.cargado.cfg || !st.cargado.eq) return;
    if (!accesoValido()) {
      pantalla('fa-qrcode', 'Enlace no válido', 'Escanee el código QR instalado en la lavandería o solicite el enlace actualizado en conserjería.');
      return;
    }
    $('edificio').textContent = (st.cfg.nombreEdificio || 'Edificio WM 815') + ' · disponibilidad en tiempo real';
    var lista = IDS.map(function (id) { return st.equipos[id]; }).filter(Boolean);
    if (!lista.length) { pantalla('fa-screwdriver-wrench', 'Lavandería en preparación', 'Conserjería aún no habilita los equipos.'); return; }
    var c = { disponible: 0, en_uso: 0, fuera_servicio: 0 };
    lista.forEach(function (e) { if (c[e.estado] != null) c[e.estado]++; });
    var mios = lista.filter(mioVigente);
    var mapa = '';
    ['lavadora', 'secadora'].forEach(function (t) {
      mapa += '<h3 class="grupo"><i class="fa-solid ' + TIPOS[t].icon + '" aria-hidden="true"></i> ' + TIPOS[t].plural + '</h3><div class="grid">' +
        lista.filter(function (e) { return e.tipo === t; }).sort(function (a, b) { return a.numero - b.numero; }).map(tarjeta).join('') + '</div>';
    });
    $('app').innerHTML =
      '<section class="resumen" aria-label="Resumen">' +
      '<div class="chip ok"><b>' + c.disponible + '</b><span>Disponibles</span></div>' +
      '<div class="chip uso"><b>' + c.en_uso + '</b><span>En uso</span></div>' +
      '<div class="chip off"><b>' + c.fuera_servicio + '</b><span>Fuera de servicio</span></div></section>' +
      '<section class="mios" style="display:' + (mios.length ? 'block' : 'none') + '"><h2><i class="fa-solid fa-user-check" aria-hidden="true"></i> Sus equipos en uso</h2>' +
      mios.map(function (e) {
        return '<div class="mios-row"><span><strong>' + esc(label(e)) + '</strong> · Depto ' + esc(e.unidad) + ' · desde ' + hora(e.inicio) + '</span>' +
          '<button type="button" class="btn btn-p azul btn-mini" data-eq="' + esc(e.id) + '">Finalizar</button></div>';
      }).join('') + '</section>' +
      '<section class="card accent-lav">' +
      '<div class="card-h"><h3><i class="fa-solid fa-soap" aria-hidden="true" style="margin-right:0.35rem;opacity:0.9"></i>Mapa de lavandería</h3>' +
      '<div class="legend"><span class="l1">Disponible</span><span class="l2">En uso</span><span class="l3">Fuera de servicio</span></div></div>' +
      '<div class="card-b">' + mapa +
      '<p class="nota">Esta pantalla se actualiza sola. Solo puede finalizar los equipos registrados por su departamento.</p></div></section>';
  }

  /* ---------- Hoja modal ---------- */
  function abrirHoja(html) {
    $('hoja').innerHTML = html;
    $('velo').classList.add('open');
    var inp = $('hoja').querySelector('input');
    if (inp) setTimeout(function () { inp.focus(); }, 60);
  }
  function cerrarHoja() { $('velo').classList.remove('open'); $('hoja').innerHTML = ''; }
  function ocupado(btn, si, txt) { if (!btn) return; btn.disabled = si; if (txt) btn.textContent = txt; }

  function flujoRegistrar(eq) {
    abrirHoja(
      '<h2 id="hojaTitulo">Registrar ' + esc(label(eq)) + '</h2>' +
      '<p>Ingrese el número de su departamento.</p>' +
      '<form id="fReg" autocomplete="off"><label for="iDep">Departamento</label>' +
      '<input id="iDep" inputmode="numeric" maxlength="8" placeholder="Ej: 1914" required>' +
      '<p class="err" id="eReg"></p>' +
      '<div class="botones"><button type="button" class="btn btn-s" data-cerrar>Cancelar</button><button type="submit" class="btn btn-p">Continuar</button></div></form>'
    );
    $('fReg').onsubmit = function (ev) {
      ev.preventDefault();
      var raw = $('iDep').value.trim();
      var unidad = buscarUnidad(raw);
      if (!raw) { $('eReg').textContent = 'Ingrese el número de departamento.'; return; }
      if (!(st.cfg.unidades || []).length) { $('eReg').textContent = 'El sistema aún no tiene el listado de unidades. Consulte en conserjería.'; return; }
      if (!unidad) { $('eReg').textContent = 'El departamento ' + raw + ' no existe en el edificio.'; return; }
      if (unidadBloqueada(unidad)) { $('eReg').textContent = 'Su unidad no está habilitada para usar la lavandería. Consulte en conserjería.'; return; }
      var lim = limiteUnidad(unidad);
      if (lim.superado) {
        mostrarAvisoLimite(unidad, lim.enUso, lim.max);
        return;
      }
      confirmarRegistro(eq, unidad);
    };
  }
  function confirmarRegistro(eq, unidad) {
    var lim = limiteUnidad(unidad);
    if (lim.superado) {
      mostrarAvisoLimite(unidad, lim.enUso, lim.max);
      return;
    }
    abrirHoja(
      '<h2 id="hojaTitulo">Confirmar registro</h2>' +
      '<div class="resumen-conf">Equipo: <strong>' + esc(label(eq)) + '</strong><br>Departamento: <strong>' + esc(unidad) + '</strong><br>Fecha: ' + fechaHora(nowIso()) + '</div>' +
      '<p>Se enviará una confirmación al correo registrado de la unidad.</p>' +
      '<p class="err" id="eConf"></p>' +
      '<div class="botones"><button type="button" class="btn btn-s" id="bVolver">Volver</button><button type="button" class="btn btn-p" id="bConf">Confirmar</button></div>'
    );
    $('bVolver').onclick = function () { flujoRegistrar(eq); };
    $('bConf').onclick = function () {
      var b = $('bConf');
      ocupado(b, true, 'Registrando…');
      registrar(eq.id, unidad).then(function (r) {
        abrirHoja(
          '<div class="ok-ic"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></div>' +
          '<h2 id="hojaTitulo" style="text-align:center">' + esc(label(eq)) + ' registrada</h2>' +
          '<p style="text-align:center">Quedó a nombre del depto <strong>' + esc(unidad) + '</strong>. Este teléfono recordará su registro para finalizarlo con un toque.</p>' +
          '<p style="text-align:center;margin-bottom:0">Su código para finalizar el uso (también se envía a su correo y está disponible en conserjería):</p>' +
          '<div class="codigo">' + esc(r.codigo) + '</div>' +
          '<div class="botones"><button type="button" class="btn btn-p" data-cerrar>Listo</button></div>'
        );
      }).catch(function (e) {
        console.warn('[lavandería]', e);
        if (esErrorLimite(e)) {
          mostrarAvisoLimite(e.unidad || unidad, e.enUso || limiteUnidad(unidad).enUso, e.max || Number(st.cfg.maxPorUnidad) || 0);
          return;
        }
        ocupado(b, false, 'Confirmar');
        $('eConf').textContent = e && e.lavUsuario ? e.message : 'No se pudo registrar. Revise su conexión e intente nuevamente.';
      });
    };
  }
  function flujoLiberar(eq) {
    var mio = mioVigente(eq);
    if (mio) {
      abrirHoja(
        '<h2 id="hojaTitulo">Finalizar uso</h2>' +
        '<div class="resumen-conf">Equipo: <strong>' + esc(label(eq)) + '</strong><br>Departamento: <strong>' + esc(eq.unidad) + '</strong><br>Desde: ' + hora(eq.inicio) + ' (' + minutos(Date.now() - Date.parse(eq.inicio)) + ')</div>' +
        '<p>¿Ya retiró su ropa? El equipo quedará disponible para otros residentes.</p>' +
        '<p class="err" id="eLib"></p>' +
        '<div class="botones"><button type="button" class="btn btn-s" data-cerrar>Cancelar</button><button type="button" class="btn btn-p azul" id="bLib">Finalizar uso</button></div>'
      );
      $('bLib').onclick = function () { ejecutarLiberar(eq, mio.unidad, mio.codigo, $('bLib'), $('eLib')); };
      return;
    }
    abrirHoja(
      '<h2 id="hojaTitulo">' + esc(label(eq)) + ' en uso</h2>' +
      '<p>Registrada por el depto <strong>' + esc(eq.unidad) + '</strong> desde las ' + hora(eq.inicio) + '. Si es suya, ingrese su departamento y el código que recibió al registrarla.</p>' +
      '<form id="fLib" autocomplete="off"><label for="iDepL">Departamento</label><input id="iDepL" inputmode="numeric" maxlength="8" required>' +
      '<label for="iCod">Código de 4 dígitos</label><input id="iCod" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required>' +
      '<p class="err" id="eLib"></p>' +
      '<div class="botones"><button type="button" class="btn btn-s" data-cerrar>Cancelar</button><button type="submit" class="btn btn-p azul" id="bLib">Finalizar uso</button></div></form>' +
      '<p style="margin:12px 0 0;font-size:0.8rem">El código está en el correo de confirmación. También puede pedirlo en conserjería.</p>'
    );
    $('fLib').onsubmit = function (ev) {
      ev.preventDefault();
      var espera = bloqueoIntentos();
      if (espera) { $('eLib').textContent = 'Demasiados intentos. Espere ' + espera + ' s.'; return; }
      var dep = $('iDepL').value.trim();
      var cod = $('iCod').value.trim();
      if (norm(dep) !== norm(eq.unidad)) { $('eLib').textContent = 'Este equipo está registrado a nombre de otro departamento. No puede finalizarlo.'; return; }
      if (!/^\d{4}$/.test(cod)) { $('eLib').textContent = 'El código debe tener 4 dígitos.'; return; }
      ejecutarLiberar(eq, dep, cod, $('bLib'), $('eLib'));
    };
  }
  function ejecutarLiberar(eq, unidad, codigo, btn, errEl) {
    ocupado(btn, true, 'Finalizando…');
    liberar(eq.id, unidad, codigo).then(function () {
      cerrarHoja();
      toast(label(eq) + ' quedó disponible. ¡Gracias!');
    }).catch(function (e) {
      console.warn('[lavandería]', e);
      if (e && e.codigo) sumarIntentoFallido();
      if (e && e.lavUsuario && /ya fue liberado/.test(e.message)) guardarMio(eq.id, null);
      ocupado(btn, false, 'Finalizar uso');
      errEl.textContent = e && e.lavUsuario ? e.message : 'No se pudo finalizar. Revise su conexión e intente nuevamente.';
    });
  }

  document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-cerrar-limite]') || (ev.target.classList && ev.target.classList.contains('modulo-carga'))) {
      cerrarAvisoLimite();
      return;
    }
    if (ev.target.closest('[data-cerrar]') || ev.target === $('velo')) { cerrarHoja(); return; }
    var b = ev.target.closest('[data-eq]');
    if (!b || !accesoValido()) return;
    var eq = st.equipos[b.getAttribute('data-eq')];
    if (!eq) return;
    if (eq.estado === 'disponible') flujoRegistrar(eq);
    else if (eq.estado === 'en_uso') flujoLiberar(eq);
    else toast(label(eq) + ' está fuera de servicio' + (eq.motivo ? ': ' + eq.motivo : '') + '.');
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (document.querySelector('.modulo-carga')) cerrarAvisoLimite();
    else cerrarHoja();
  });

  /* ---------- Tiempo real ---------- */
  if (!token) {
    st.cargado.cfg = st.cargado.eq = true;
    pantalla('fa-qrcode', 'Enlace no válido', 'Escanee el código QR instalado en la lavandería o solicite el enlace en conserjería.');
    return;
  }
  db.collection(COL_CFG).doc('config').onSnapshot(function (s) {
    st.cfg = s.exists ? s.data() || {} : {};
    st.cargado.cfg = true;
    render();
  }, function (e) {
    console.warn('[lavandería] config', e);
    pantalla('fa-wifi', 'No se pudo conectar', 'Revise su conexión a internet y vuelva a cargar la página.');
  });
  db.collection(COL_EQ).onSnapshot({ includeMetadataChanges: true }, function (qs) {
    var eqs = {};
    qs.forEach(function (d) { eqs[d.id] = Object.assign({ id: d.id }, d.data()); });
    st.equipos = eqs;
    st.cargado.eq = true;
    render();
  }, function (e) {
    console.warn('[lavandería] equipos', e);
  });
  setInterval(render, 30000);
})();
</script>
</body>
</html>
